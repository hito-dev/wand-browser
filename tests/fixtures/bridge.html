<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wand hardware fixtures</title>
<link rel="canonical" href="https://wand.hito.ai/fixtures/bridge.html">
<link rel="describedby" type="text/plain" href="../llms.txt">
<link rel="icon" type="image/png" sizes="64x64" href="../favicon.png">
<script defer src="https://stat.hito.ai/script.js" data-website-id="8453ddb7-edef-41fa-8684-79e94f6940cf"></script>
<style>
  :root { color-scheme: light dark; font: 17px system-ui; }
  * { box-sizing: border-box; }
  html { height: 100%; overflow: hidden; }
  body {
    position: fixed;
    top: var(--viewport-top, 0px);
    left: 0;
    right: 0;
    margin: 0 auto;
    width: 100%;
    max-width: 42rem;
    height: 100vh;
    height: var(--viewport-height, 100dvh);
    display: grid;
    grid-template-rows: minmax(0, 1fr) var(--console-height, 20%);
    overflow: hidden;
  }
  #controls, #log { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  #controls {
    scroll-padding-block: 20px;
    padding: max(20px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
      20px max(24px, env(safe-area-inset-left));
  }
  h1 { margin-top: 0; font-size: 1.6rem; }
  button, input, a { font: inherit; padding: 12px; margin: 6px 0; }
  button { display: block; min-height: 44px; max-width: 100%; }
  input { width: 100%; }
  #console {
    position: relative;
    min-height: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    border-top: 1px solid GrayText;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #console-divider {
    position: absolute;
    z-index: 1;
    top: -12px;
    left: 0;
    right: 0;
    height: 24px;
    cursor: row-resize;
    touch-action: none;
    user-select: none;
  }
  #console-divider::after {
    content: "";
    position: absolute;
    top: 9px;
    left: calc(50% - 24px);
    width: 48px;
    height: 5px;
    border-radius: 3px;
    background: GrayText;
  }
  #console-divider:focus-visible { outline: 2px solid Highlight; outline-offset: -2px; }
  #console h2 {
    margin: 0;
    padding: 12px max(24px, env(safe-area-inset-right)) 8px max(24px, env(safe-area-inset-left));
    font-size: .85rem;
  }
  #log {
    margin: 0;
    padding: 0 max(24px, env(safe-area-inset-right)) 16px max(24px, env(safe-area-inset-left));
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
<main id="controls" aria-labelledby="fixture-title" tabindex="0">
<h1 id="fixture-title">Wand hardware fixtures</h1>
<p>These actions use the browser’s hardware APIs. Select only your own test wallet and writable test tags.</p>
<button id="fullscreen">Enter WebKit fullscreen</button>
<button id="ble">Choose Bluetooth device</button>
<button id="scan">Scan NFC</button>
<button id="abort">Stop NFC scan</button>
<label>NFC text <input id="text" value="Hello from Hito Wand"></label>
<button id="write">Write NFC text</button>
<button id="binary">Write NFC binary record</button>
<p><a href="./second.html">Open second page</a></p>
<p><a href="./second.html" target="_blank">Open new-window link</a></p>
</main>
<section id="console" aria-labelledby="console-title">
<div id="console-divider" role="separator" tabindex="0" aria-label="Resize console"
  aria-orientation="horizontal" aria-controls="console" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20"></div>
<h2 id="console-title">Console</h2>
<pre id="log" role="log" aria-live="polite" aria-labelledby="console-title" tabindex="0">Ready.</pre>
</section>
<iframe id="child" title="Same-origin security fixture" src="./child.html" hidden></iframe>
<script>
const output = document.querySelector("#log");
const followingOutput = () => output.scrollHeight - output.clientHeight - output.scrollTop <= 24;
function log(text) {
  const follow = followingOutput();
  output.append(document.createTextNode("\n" + text));
  if (follow) output.scrollTop = output.scrollHeight;
}

const divider = document.querySelector("#console-divider");
let consoleRatio = 0.2;
function resizeConsole(ratio = consoleRatio) {
  const height = document.body.getBoundingClientRect().height;
  if (!height) return;
  const minimum = Math.min(80, height / 2);
  const consoleHeight = Math.min(height - minimum, Math.max(minimum, height * ratio));
  document.body.style.setProperty("--console-height", `${consoleHeight}px`);
  divider.setAttribute("aria-valuemin", String(Math.round(minimum / height * 100)));
  divider.setAttribute("aria-valuemax", String(Math.round((height - minimum) / height * 100)));
  divider.setAttribute("aria-valuenow", String(Math.round(consoleHeight / height * 100)));
  divider.setAttribute("aria-valuetext", `${Math.round(consoleHeight / height * 100)}% console height`);
  return consoleHeight / height;
}
let drag = null;
divider.addEventListener("pointerdown", event => {
  if (drag || !event.isPrimary || event.button !== 0) return;
  event.preventDefault();
  const bounds = document.body.getBoundingClientRect();
  drag = { id: event.pointerId, offset: bounds.bottom - event.clientY - document.querySelector("#console").getBoundingClientRect().height };
  divider.setPointerCapture(event.pointerId);
});
divider.addEventListener("pointermove", event => {
  if (!drag || event.pointerId !== drag.id) return;
  const bounds = document.body.getBoundingClientRect();
  const follow = followingOutput();
  consoleRatio = resizeConsole((bounds.bottom - event.clientY - drag.offset) / bounds.height);
  if (follow) output.scrollTop = output.scrollHeight;
});
function endDrag(event) {
  if (!drag || event.pointerId !== drag.id) return;
  drag = null;
  if (divider.hasPointerCapture(event.pointerId)) divider.releasePointerCapture(event.pointerId);
}
divider.addEventListener("pointerup", endDrag);
divider.addEventListener("pointercancel", endDrag);
divider.addEventListener("lostpointercapture", endDrag);
divider.addEventListener("keydown", event => {
  let ratio;
  if (event.key === "ArrowUp") ratio = consoleRatio + 0.05;
  else if (event.key === "ArrowDown") ratio = consoleRatio - 0.05;
  else if (event.key === "Home") ratio = 0;
  else if (event.key === "End") ratio = 1;
  else return;
  event.preventDefault();
  const follow = followingOutput();
  consoleRatio = resizeConsole(ratio);
  if (follow) output.scrollTop = output.scrollHeight;
});

function updateViewport() {
  const viewport = window.visualViewport;
  // Leave pinch zoom to the browser; only fit unzoomed viewport/keyboard changes.
  if (viewport && viewport.scale !== 1) return;
  const follow = followingOutput();
  document.documentElement.style.setProperty("--viewport-height", `${viewport?.height ?? window.innerHeight}px`);
  document.documentElement.style.setProperty("--viewport-top", `${viewport?.offsetTop ?? 0}px`);
  resizeConsole();
  requestAnimationFrame(() => {
    if (follow) output.scrollTop = output.scrollHeight;
    const focused = document.activeElement;
    if (focused?.matches("input") && document.querySelector("#controls").contains(focused)) {
      focused.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  });
}
window.visualViewport?.addEventListener("resize", updateViewport);
window.visualViewport?.addEventListener("scroll", updateViewport);
window.addEventListener("resize", updateViewport);
document.addEventListener("fullscreenchange", updateViewport);
updateViewport();

(() => {
const fullscreenButton = document.querySelector("#fullscreen");
fullscreenButton.onclick = async () => {
  try {
  if (document.fullscreenElement) {
    await document.exitFullscreen();
  } else {
    if (!document.fullscreenEnabled || typeof document.documentElement.requestFullscreen !== "function") {
      throw new DOMException("Element fullscreen is unavailable in this browser.", "NotSupportedError");
    }
    await document.documentElement.requestFullscreen();
  }
  } catch (e) { log(`${e.name}: ${e.message}`); }
};
document.addEventListener("fullscreenchange", () => {
  const active = Boolean(document.fullscreenElement);
  fullscreenButton.textContent = active ? "Exit WebKit fullscreen" : "Enter WebKit fullscreen";
  log(active ? "Entered WebKit fullscreen" : "Exited WebKit fullscreen");
});
document.addEventListener("fullscreenerror", () => log("Fullscreen request failed."));
})();
</script>
<script type="module">
const run = action => async () => { try { await action(); } catch (e) { log(`${e.name}: ${e.message}`); } };
let reader, abort;
document.querySelector("#ble").onclick = run(async () => {
  const device = await navigator.bluetooth.requestDevice({
    filters: [{ namePrefix: "hito" }, { namePrefix: "Hito" }],
    optionalServices: ["5cc44b16-070a-11ed-b939-0242ac120002"]
  });
  log(`Selected ${device.name}`);
  await device.gatt.connect();
  log("Connected");
  device.ongattserverdisconnected = () => log("Disconnected");
});
document.querySelector("#scan").onclick = run(async () => {
  reader ??= new NDEFReader();
  abort = new AbortController();
  reader.onreading = ({ message, serialNumber }) => {
    log(`Read ${message.records.length} records; serial: ${serialNumber || "(unavailable)"}`);
    for (const record of message.records) {
      log(`${record.recordType}: ${record.recordType === "text" || record.recordType === "url"
        ? new TextDecoder(record.encoding ?? "utf-8").decode(record.data)
        : Array.from(new Uint8Array(record.data.buffer)).join(",")}`);
    }
  };
  reader.onreadingerror = () => log("NFC reading ended or failed. Check site controls for Scan again.");
  await reader.scan({ signal: abort.signal });
  log("NFC scan active");
});
document.querySelector("#abort").onclick = () => abort?.abort();
document.querySelector("#write").onclick = run(async () => {
  await (reader ?? new NDEFReader()).write(document.querySelector("#text").value);
  log("Text written");
});
document.querySelector("#binary").onclick = run(async () => {
  await (reader ?? new NDEFReader()).write(new Uint8Array([0, 1, 127, 128, 255]));
  log("Binary record written");
});
</script>
</body>
</html>
