<main id="controls" aria-labelledby="fixture-title" tabindex="0">
<h1 id="fixture-title">$fixture</h1>
<p>$fixtureIntro</p>
<button id="ble">$choose</button>
<button id="scan">$scan</button>
<button id="abort">$stop</button>
<label>$text <input id="text" value="Hello from Hito Wand"></label>
<button id="write">$write</button>
<button id="binary">$binary</button>
<p><a href="./second.html">$second</a></p>
<p><a href="./second.html" target="_blank">$window</a></p>
$navigation</main>
<section id="console" aria-labelledby="console-title">
<div id="console-divider" role="separator" tabindex="0" aria-label="$resize"
  aria-orientation="horizontal" aria-controls="console" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20"></div>
<h2 id="console-title">$console</h2>
<pre id="log" role="log" aria-live="polite" aria-labelledby="console-title" tabindex="0">$ready</pre>
</section>
<iframe id="child" title="Same-origin security fixture" src="/fixtures/child.html" hidden></iframe>
